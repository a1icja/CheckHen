datasources:
- uid: primary-datasource
  orgId: 1
  name: grafana-postgresql-datasource
  type: grafana-postgresql-datasource
  typeName: PostgreSQL
  typeLogoUrl: public/app/plugins/datasource/grafana-postgresql-datasource/img/postgresql_logo.svg
  access: proxy
  url: db:5432
  user: postgres
  database: ''
  basicAuth: false
  isDefault: true
  jsonData:
    connMaxLifetime: 14400
    database: postgres
    maxIdleConns: 100
    maxIdleConnsAuto: true
    maxOpenConns: 100
    postgresVersion: 1300
    sslmode: disable
    tlsAuth: false
    tlsAuthWithCACert: false
    tlsSkipVerify: true
  readOnly: false
