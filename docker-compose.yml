services:
  490-test:
    # build: 
    #   context: ./checkhen
    #   args:
    #     - DATABASE_URL=postgres://postgres:postgres@db:5432/postgres
    image: ghcr.io/a1icja/checkhen:main
    container_name: 490-test
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://postgres:postgres@db:5432/postgres
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_Zmlyc3QtbWFzdG9kb24tODMuY2xlcmsuYWNjb3VudHMuZGV2JA
      - CLERK_SECRET_KEY=sk_test_aT6wTiUOgvehOqoLHdwnzWnnN78MD6u0xRI2fmgg0l
      - NTFY_TOPIC=checkhen-ds490
    develop:
      watch:
        - action: rebuild
          path: ./checkhen/
    depends_on:
      - db
      - socket
  db:
    image: postgres:13
    container_name: 490-db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
  socket:
    build:
      context: ./socket-server
      args:
        - DATABASE_URL=postgres://postgres:postgres@db:5432/postgres
    container_name: 490-socket
    ports:
      - "6060:6060"
    environment:
      - PORT=6060
      - DATABASE_URL=postgres://postgres:postgres@db:5432/postgres
    develop:
      watch:
        - action: rebuild
          path: ./socket-server/
    depends_on:
      - db
  grafana:
    image: grafana/grafana-oss:latest
    container_name: 490-grafana
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/dashboards/:/etc/grafana/provisioning/dashboards/
      - ./grafana/provisioning/datasources/:/etc/grafana/provisioning/datasources/
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - db
volumes:
  pgdata:
  grafana-data: