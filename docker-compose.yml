services:
  490-test:
    #do this 
    # image: ghcr.io/a1icja/checkhen:main
    # OR
    build:
      context: ./checkhen/
      dockerfile: Dockerfile
    container_name: 490-test
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgres://ds490:ds490-secure-password@db:5432/postgres
      - NEXT_PUBLIC_EMAIL_DOMAIN=bu.edu
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:6060
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - ALLOWED_TEST_EMAILS=${ALLOWED_TEST_EMAILS}
    develop:
      watch:
        - action: rebuild
          path: ./checkhen/
    depends_on:
      - db
      - socket
  db:
    image: postgres:13
    container_name: 490-db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ds490
      POSTGRES_PASSWORD: ds490-secure-password
      POSTGRES_DB: postgres
  socket:
    # image: ghcr.io/a1icja/socket-server:main
    build:
      context: ./socket-server/
      dockerfile: Dockerfile
    container_name: 490-socket
    ports:
      - "6060:6060"
    environment:
      - PORT=6060
      - DATABASE_URL=postgres://ds490:ds490-secure-password@db:5432/postgres
    develop:
      watch:
        - action: rebuild
          path: ./socket-server/
    depends_on:
      - db
  dns:
    # Lightweight dnsmasq container for closed-internet exam filtering.
    # Only started during exams via pi-setup/start-exam.sh — not needed for dev.
    # 4km3/dnsmasq has confirmed ARM/ARM64 builds, suitable for Raspberry Pi 3B+.
    image: 4km3/dnsmasq:2.90-r2
    container_name: 490-dns
    network_mode: host          # must bind to port 53 on wlan0 (Pi AP interface)
    cap_add:
      - NET_BIND_SERVICE        # allows binding to port 53 without root
    cap_drop:
      - ALL                     # drop everything else — no CAP_NET_ADMIN needed
    volumes:
      - ./dns/dnsmasq.conf:/etc/dnsmasq.conf:ro
      - ./dns/allowlist.conf:/etc/dnsmasq.d/allowlist.conf:ro
    restart: unless-stopped
    profiles:
      - exam                    # only starts with: docker compose --profile exam up -d dns
