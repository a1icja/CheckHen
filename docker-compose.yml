services:
  490-test:
    # image: ghcr.io/a1icja/checkhen:main
    build:
      context: ./checkhen/
      dockerfile: Dockerfile
    container_name: 490-test
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://<POSTGRES_USER>:<POSTGRES_PASSWORD>@db:5432/<POSTGRES_DB>
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=<FILL_ME_IN>
      - CLERK_SECRET_KEY=<FILL_ME_IN>
      - NTFY_TOPIC=<FILL_ME_IN>
    develop:
      watch:
        - action: rebuild
          path: ./checkhen/
    depends_on:
      - db
      - socket
  db:
    image: postgres:13
    container_name: 490-db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: <FILL_ME_IN>
      POSTGRES_PASSWORD: <FILL_ME_IN>
      POSTGRES_DB: <FILL_ME_IN>
  socket:
    # image: ghcr.io/a1icja/socket-server:main
    build:
      context: ./socket-server/
      dockerfile: Dockerfile
    container_name: 490-socket
    ports:
      - "6060:6060"
    environment:
      - PORT=6060
      - DATABASE_URL=postgres://<POSTGRES_USER>:<POSTGRES_PASSWORD>@db:5432/<POSTGRES_DB>
    develop:
      watch:
        - action: rebuild
          path: ./socket-server/
    depends_on:
      - db
